name: Test build

# Builds a "Numio Test" APK for trying changes on a phone before a release.
# It installs next to the real Numio (different app id), so nothing gets replaced.
# Release APKs are still built and signed by hand, not here.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Only changes the copy on this build machine, never the repo:
      # app id com.rr.numio.test and the name "Numio Test".
      - name: Make it a test app
        run: |
          sed -i 's/applicationId = "com.rr.numio"/applicationId = "com.rr.numio.test"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">Numio</string>#<string name="app_name">Numio Test</string>#' app/src/main/res/values/strings.xml
          grep -n 'applicationId' app/build.gradle.kts
          grep -n 'app_name' app/src/main/res/values/strings.xml

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build test APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check no internet permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q 'android.permission.INTERNET'; then
            echo "INTERNET permission found - Numio must stay offline"; exit 1
          fi
          echo "No INTERNET permission"

      - uses: actions/upload-artifact@v4
        with:
          name: NumioTest-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
